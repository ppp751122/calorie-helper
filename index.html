<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">
<title>熱量小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F0EC; --surface:#FFFFFF; --ink:#1B3530; --muted:#4F6863; --line:#CFDDD6;
  --fuel:#F2B705; --fuel2:#F7D25E; --room:#2F6FDB; --over:#D64545; --ok:#2E8B57; --water:#3A8DE0; --water2:#8CC2F2;
  --body:#D6E3DD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10201C; --surface:#18302A; --ink:#E6F0EC; --muted:#93AAA3; --line:#2A463E;
    --fuel:#F2B705; --fuel2:#B8890A; --room:#6E9BF0; --over:#F07070; --ok:#5CC48A; --body:#24413A; --water:#5AA6F0; --water2:#2C5F92;
  }
}
:root[data-theme="dark"]{
  --bg:#10201C; --surface:#18302A; --ink:#E6F0EC; --muted:#93AAA3; --line:#2A463E;
  --fuel:#F2B705; --fuel2:#B8890A; --room:#6E9BF0; --over:#F07070; --ok:#5CC48A; --body:#24413A; --water:#5AA6F0; --water2:#2C5F92;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.num{font-family:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:16px 18px 110px}
h1{font-size:20px;margin:4px 0 2px;font-weight:700}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--room);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--ink);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.fuel{background:var(--fuel);color:#1B1B10}
.btn:disabled{opacity:.5}
.steps ol{padding-left:20px;margin:4px 0 10px}.steps li{margin-bottom:6px;line-height:1.6}
.hub3{grid-template-columns:1fr 1fr 1fr!important}
.wcard{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
.wbody{position:relative}
.bottle{width:100%;height:auto;display:block}
.bt-bg{fill:var(--bg)}
.bt-water{transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.bt-wave{fill:var(--water);animation:wave 3.2s linear infinite}
.bt-wave2{fill:var(--water);opacity:.55;animation:wave 4.6s linear infinite reverse}
.bt-tick{stroke:var(--surface);stroke-width:1.5;opacity:.8}
.bt-glass{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.bt-cap{fill:var(--water2);stroke:var(--ink);stroke-width:2}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(45px)}}
.wfloat{position:absolute;left:0;right:0;top:40%;text-align:center;font-weight:700;color:var(--water);opacity:0;pointer-events:none}
.wfloat.go{animation:wfl .9s ease-out}
@keyframes wfl{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
.wbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wbtns .btn{padding:9px 4px;font-size:15px}
.wlink{font-size:13px;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.sheet .bottle{width:64px}
@media (prefers-reduced-motion:reduce){.bt-wave,.bt-wave2{animation:none}.bt-water{transition:none}}
.lkcode{display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:14px;padding:12px;margin:10px 0}
.lkcode b{font-size:32px;letter-spacing:4px}
.gate-link{text-align:left;background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-size:24px;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.arow{padding:10px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.an{display:flex;flex-direction:column}.an .muted{font-size:12px}
.atags i{font-style:normal;font-size:11px;background:var(--bg);border-radius:6px;padding:1px 6px;margin-right:4px}
.am{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted);margin-top:4px}
.am b{color:var(--ink)}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hub-h{font-size:13px;color:var(--muted);margin:14px 0 6px}
.hub-h:first-of-type{margin-top:4px}
.btn .ic{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.ic{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;align-items:center}
.panel{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:14px}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-top:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}

/* Hero: the body gauge */
.hero{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin:8px 0 14px}
.figure svg{width:150px;height:auto;display:block}
.stat-big{font-size:52px;line-height:1;font-weight:700}
.stat-big small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.stat-lbl{font-size:14px;color:var(--muted);margin-bottom:4px}
.minirow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.over .stat-big{color:var(--over)}

.macros{display:flex;gap:8px}
.macro{flex:1;background:var(--bg);border-radius:12px;padding:8px 10px}
.macro b{display:block;font-size:18px}
.macro span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted);border-radius:3px;transition:width .6s}
.bar i.go,.bar i.ok{background:var(--ok)}.bar i.near{background:var(--fuel)}.bar i.over{background:var(--over)}
.macro span em{font-style:normal;margin-left:4px;font-size:11px;opacity:.8}

.meal{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .t{font-weight:700}
.mthumb{flex:none;width:48px;height:48px;padding:0;border:0;border-radius:10px;overflow:hidden;margin-right:10px;background:var(--line)}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-big{display:block;width:min(100%,320px);aspect-ratio:1;object-fit:cover;border-radius:16px;margin:4px auto 10px}
.meal .d{font-size:13px;color:var(--muted)}
.meal .k{font-weight:700;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);padding:2px 6px;font-size:18px;line-height:1}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:5}
nav.tabs button{border:0;background:transparent;font-size:12px;color:var(--muted);padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs .cam{background:var(--fuel);color:#1B1B10;border-radius:18px;width:58px;height:58px;margin-top:-26px;justify-content:center;box-shadow:0 0 0 5px var(--bg)}
nav.tabs .cam svg{width:28px;height:28px}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,20,18,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet-wrap.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.preview{width:100%;border-radius:14px;max-height:240px;object-fit:cover;display:block;margin-bottom:12px}
.item{display:grid;grid-template-columns:1fr 84px 28px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item input{width:100%;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:right}
.item .n{font-weight:700}
.item .p{font-size:12px;color:var(--muted)}
.thinking{display:flex;gap:10px;align-items:center;padding:16px 0;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--fuel);animation:b 1s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{to{transform:translateY(-6px);opacity:.4}}

/* Impact */
.impact{text-align:center}
.impact .big{font-size:44px;font-weight:700;line-height:1}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.eq div{background:var(--bg);border-radius:14px;padding:10px 6px}
.eq b{display:block;font-size:20px}
.eq span{font-size:12px;color:var(--muted)}
.walker{animation:walk .5s infinite alternate ease-in-out;transform-origin:50% 100%}
@keyframes walk{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

.week{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--fuel);min-height:2px;transition:height .6s}
.week i.over{background:var(--over)}
.goal-line{position:relative}
.wk2 .wrow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:11px;color:var(--muted)}
.wbars{position:relative;height:110px;margin:4px 0}
.wbars>div:not(.wgoal){display:flex;align-items:flex-end;height:100%}
.wbars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--fuel);transition:height .6s}
.wbars i.over{background:var(--over)}
.wgoal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink);opacity:.55;z-index:1;pointer-events:none}
.wdays .td{color:var(--ink);font-weight:700}

.advice{white-space:pre-wrap;font-size:15px}
.tip{border-left:4px solid var(--fuel);padding:2px 0 2px 12px;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none}

:root{--skin:#F4C7A1}
.char{display:block;overflow:visible}
.figure .char{width:150px;height:auto;overflow:visible}
.char .torso{transform-box:fill-box;transform-origin:50% 100%;transform:scale(var(--s0),1)}
.char .b{transform-box:fill-box;transform-origin:center}
.cm{font-size:13px;margin-top:3px;color:var(--ink);opacity:.8}
.cm.savage{color:var(--over)}
.stage{position:relative;height:330px;overflow:hidden;border-radius:22px;margin-bottom:12px;background:#DCEBE3}
.scene{position:absolute;inset:0;width:100%;height:100%}
.scene .dusk{opacity:0;transition:opacity 1.2s 1.6s}
.stage.over.run .scene .dusk{opacity:.45}
.cloud{animation:drift 26s linear infinite}
.cloud.c2{animation-duration:34s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.grass{transform-box:fill-box;transform-origin:bottom;animation:sway 2.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
.actor{position:absolute;left:50%;bottom:8px;width:190px;margin-left:-95px}
.actor .char{width:100%;height:auto;overflow:visible}
.char .head{transform-box:fill-box;transform-origin:50% 90%}
.char .cheeks{transform-box:fill-box;transform-origin:center}
.char .shadow{transform-box:fill-box;transform-origin:center;transform:scale(var(--s0),1)}
.figure .char .torso,.pl .char .torso{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(var(--s0),1)}50%{transform:scale(calc(var(--s0)*1.02),1.015)}}
.food{position:absolute;left:50%;top:150px;font-size:34px;opacity:0;pointer-events:none}
.food .steam{position:absolute;left:8px;top:-20px;font-style:normal;font-size:16px;color:#fff;opacity:.8;animation:steam 1s ease-in-out infinite}
@keyframes steam{from{transform:translateY(0);opacity:.8}to{transform:translateY(-8px);opacity:0}}
.stage.run .food{animation:floatin 1.3s cubic-bezier(.45,.05,.4,1) forwards}
@keyframes floatin{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.8)}20%{opacity:1}55%{opacity:1;transform:translate(calc(var(--x)*.45),calc(var(--y)*.3 - 40px)) scale(1.1) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-30px) scale(.25) rotate(10deg)}}
.munch{position:absolute;left:62%;top:92px;font-weight:700;color:#5B4636;opacity:0;font-size:15px}
.stage.run .munch{animation:munch 1.4s ease 1s forwards}
@keyframes munch{0%,100%{opacity:0;transform:translateY(4px)}20%,80%{opacity:1;transform:translateY(0)}}
.stage.run .char .cheeks{animation:chew .22s ease-in-out .9s 8 alternate}
@keyframes chew{to{transform:scale(1.35,1.15)}}
.stage.run .char .head{animation:nod .44s ease-in-out .9s 4 alternate}
@keyframes nod{to{transform:rotate(3deg) translateY(2px)}}
.stage.run .char .torso{animation:grow 1.6s cubic-bezier(.3,1.5,.5,1) 2.2s forwards}
.stage.run .char .shadow{animation:grow 1.6s cubic-bezier(.3,1.5,.5,1) 2.2s forwards}
@keyframes grow{to{transform:scale(var(--s1),1)}}
.stage.run.over .char .torso{animation:inflate 2.8s linear 2.2s forwards}
@keyframes inflate{0%{transform:scale(var(--s0),1)}18%{transform:scale(calc(var(--s1)*1.28),.84)}32%{transform:scale(calc(var(--s1)*.86),1.12)}46%{transform:scale(calc(var(--s1)*1.14),.93)}60%{transform:scale(calc(var(--s1)*.95),1.05)}76%{transform:scale(calc(var(--s1)*1.04),.98)}100%{transform:scale(var(--s1),1)}}
.stage.run.over .actor{animation:hop .5s cubic-bezier(.3,0,.6,1) 2.1s 1,shake .09s linear 2.6s 12}
@keyframes hop{50%{transform:translateY(-34px)}}
@keyframes shake{25%{transform:translate(-7px,2px) rotate(-2deg)}75%{transform:translate(7px,-2px) rotate(2deg)}}
.stage.run.ok .actor{animation:hop .55s ease-out 2.4s 2}
.stage.run.near .char .torso{animation:grow 1.6s cubic-bezier(.3,1.5,.5,1) 2.2s forwards,wobble .32s ease-in-out 3.6s 6 alternate}
@keyframes wobble{from{transform:scale(var(--s1),1)}to{transform:scale(calc(var(--s1)*1.06),.97)}}
.char .b{transform-box:fill-box;transform-origin:center}
.stage.run.over .b1{animation:fly 1s ease-out 2.75s forwards;--bx:-130px}
.stage.run.over .b2{animation:fly 1s ease-out 2.85s forwards;--bx:150px}
.stage.run.over .b3{animation:fly 1s ease-out 2.95s forwards;--bx:-70px}
@keyframes fly{to{transform:translate(var(--bx),-210px) rotate(900deg) scale(2);opacity:0}}
.stage .drop{transform-box:fill-box;animation:dropit 1s ease-in infinite}
.stage .drop.d2{animation-delay:.4s}
@keyframes dropit{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.dust{position:absolute;bottom:14px;width:46px;height:22px;border-radius:50%;background:#F1E6D0;opacity:0}
.dust.d1{left:22%}.dust.d2{right:22%}.dust.d3{left:44%;bottom:6px}
.stage.run .dust{animation:dust 1s ease-out 2.75s forwards}
@keyframes dust{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.2) translateY(-14px)}}
.headline{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:24px;font-weight:900;color:#3F3326;opacity:0;transform:translateY(-8px);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.headline small{display:block;font-size:14px;font-weight:500;color:#5B4636}
.stage.over .headline{color:#9B2C1F}
.stage.run .headline{animation:hl .6s ease-out 3s forwards}
@keyframes hl{to{opacity:1;transform:none}}
.boom{position:absolute;left:14%;top:36%;font-size:56px;font-weight:900;color:#FFF3C4;-webkit-text-stroke:3px #9B2C1F;transform:scale(0) rotate(-18deg);pointer-events:none}
.boom.b2x{left:auto;right:10%;top:48%;font-size:44px}
.stage.run .boom{animation:boom .55s cubic-bezier(.2,2.2,.4,1) 2.7s forwards}
.stage.run .boom.b2x{animation-delay:3.05s}
@keyframes boom{to{transform:scale(1) rotate(-8deg)}}
.float{position:absolute;right:10px;bottom:64px;font-weight:900;font-size:21px;color:#9B2C1F;opacity:0}
.float.warn,.float.happy{color:#3F3326;right:auto;left:62%;top:40%}
.stage.run .float{animation:up 1.6s ease-out 3.3s forwards}
@keyframes up{0%{opacity:0;transform:translateY(24px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:1;transform:translateY(-30px) scale(1)}}
.leaf{position:absolute;top:-30px;font-size:20px;opacity:0}
.leaf.l1{left:15%}.leaf.l2{left:70%}.leaf.l3{left:40%}
.stage.run .leaf{animation:leaf 5s linear 2.6s forwards}
.stage.run .leaf.l2{animation-delay:3s}.stage.run .leaf.l3{animation-delay:3.4s}
@keyframes leaf{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}50%{transform:translate(40px,160px) rotate(180deg)}100%{opacity:0;transform:translate(-20px,330px) rotate(360deg)}}
.judge{text-align:left;background:var(--bg);border-radius:16px;padding:12px 14px;margin:12px 0;border-left:5px solid var(--ok)}
.judge.savage{border-left-color:var(--over)}
.judge p{margin:6px 0 0;font-size:16px;min-height:24px}
.judge.savage p{font-weight:700}
.judge .dot{display:inline-block;margin-right:6px}
@media (prefers-reduced-motion:reduce){.stage.run .char .torso{transform:scale(var(--s1),1)}.headline{opacity:1;transform:none}}

.pick{display:grid;gap:10px}
.pl{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pl.me{background:var(--bg);border-radius:12px;padding:8px 6px}
.pl .rk{text-align:center;font-size:20px}
.pl .char.mini{width:44px;height:auto}
.pl .who b{display:block}
.pl .who span{font-size:12px;color:var(--muted)}
.pl .pts{font-size:24px;font-weight:700}
.pl .pts small{font-size:12px;color:var(--muted);margin-left:2px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-bottom:12px}
.chk input{margin-top:4px;width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.ti{flex:1;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.tt{position:relative;padding:8px 28px 8px 0;border-top:1px solid var(--line)}
.tt b{margin-right:8px}
.tt p{margin:2px 0 0}
.tt .x{position:absolute;right:0;top:6px}

.item.item4{grid-template-columns:1fr 78px 28px 24px}

let rid=0;

  const sweat = m==='ok'?'':`<path class="drop" d="M136 52 q6 10 0 14 q-6 -4 0 -14z" fill="#9FD3EE" stroke="${L}" stroke-width="1.2"/>`+(m==='over'?`<path class="drop d2" d="M62 56 q5 9 0 12 q-5 -3 0 -12z" fill="#9FD3EE" stroke="${L}" stroke-width="1.2"/>`:'');
  const cheekR = m==='over'?9:6;

      <path d="M58 200 Q52 150 70 118 Q100 104 130 118 Q148 150 142 200 Q140 214 100 214 Q60 214 58 200Z" fill="#EFE6D2" stroke="${L}" stroke-width="2.2"/>
      <path d="M70 118 Q84 112 92 114 L94 210 Q74 210 60 202 Q54 150 70 118Z" fill="#7A5C43" stroke="${L}" stroke-width="2"/>

      <ellipse cx="65" cy="78" rx="5" ry="8" fill="${skin}" stroke="${L}" stroke-width="1.8"/><ellipse cx="135" cy="78" rx="5" ry="8" fill="${skin}" stroke="${L}" stroke-width="1.8"/>`;

// ---------- 我的照片：手繪濾鏡＋變胖變形 ----------
const PKEY='calorie-photo-v1';
const PH={url:null,lm:null,style:'paint',src:null,w:0,h:0,ready:false};
function defaultLM(){return {face:{x:.5,y:.38,w:.42,h:.5}}}
function fullLM(lm){
  const f=(lm&&lm.face)||defaultLM().face, ok=v=>v&&v.x>=0&&v.x<=1&&v.y>=0&&v.y<=1;
  return {face:f,
    cheekL:ok(lm?.cheekL)?lm.cheekL:{x:f.x-f.w*.28,y:f.y+f.h*.12},
    cheekR:ok(lm?.cheekR)?lm.cheekR:{x:f.x+f.w*.28,y:f.y+f.h*.12},
    mouth:ok(lm?.mouth)?lm.mouth:{x:f.x,y:f.y+f.h*.27},
    chin:ok(lm?.chin)?lm.chin:{x:f.x,y:f.y+f.h*.47},
    eyesY:(lm?.eyesY>0&&lm.eyesY<1)?lm.eyesY:f.y-f.h*.08};
}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}
async function photoPrep(){
  if(!PH.url){PH.ready=false;return}
  const img=await loadImg(PH.url); const m=360, s=Math.min(1,m/Math.max(img.width,img.height));
  const w=Math.round(img.width*s), h=Math.round(img.height*s);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
  let d=cx.getImageData(0,0,w,h);
  if(PH.style==='paint')d=paintFilter(d,w,h);
  PH.src=d;PH.w=w;PH.h=h;PH.ready=true;PH.cache={};
}
function paintFilter(d,w,h){
  const a=d.data, n=w*h, L=new Float32Array(n);
  // 1. 柔化（兩次 box blur）
  const blur=(src)=>{const out=new Uint8ClampedArray(src.length);const r=2;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){let R=0,G=0,B=0,c=0;
      for(let dy=-r;dy<=r;dy+=2)for(let dx=-r;dx<=r;dx+=2){const xx=Math.min(w-1,Math.max(0,x+dx)),yy=Math.min(h-1,Math.max(0,y+dy)),i=(yy*w+xx)*4;R+=src[i];G+=src[i+1];B+=src[i+2];c++}
      const o=(y*w+x)*4;out[o]=R/c;out[o+1]=G/c;out[o+2]=B/c;out[o+3]=255}
    return out};
  let b=blur(blur(a));
  // 2. 色塊化＋暖色調（水彩動畫感）
  const q=v=>Math.round(v/32)*32+8;
  for(let i=0,p=0;i<a.length;i+=4,p++){
    let r=b[i],g=b[i+1],bl=b[i+2];
    r=.6*q(r)+.4*r; g=.6*q(g)+.4*g; bl=.6*q(bl)+.4*bl;
    r=r*1.06+6; g=g*1.01+4; bl=bl*.9+4;
    const gray=(r+g+bl)/3; r=gray+(r-gray)*1.15; g=gray+(g-gray)*1.15; bl=gray+(bl-gray)*1.15;
    b[i]=r;b[i+1]=g;b[i+2]=bl; L[p]=.3*a[i]+.59*a[i+1]+.11*a[i+2];
  }
  // 3. 手繪線條（邊緣加深成咖啡色）
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;
    const gx=L[p+1]-L[p-1]+.5*(L[p-w+1]-L[p-w-1]+L[p+w+1]-L[p+w-1]);
    const gy=L[p+w]-L[p-w]+.5*(L[p+w-1]-L[p-w-1]+L[p+w+1]-L[p-w+1]);
    const m=Math.min(1,Math.max(0,(Math.hypot(gx,gy)-38)/70));
    if(m>0){const i=p*4;b[i]=b[i]*(1-m*.8)+74*m*.8;b[i+1]=b[i+1]*(1-m*.8)+53*m*.8;b[i+2]=b[i+2]*(1-m*.8)+38*m*.8}}
  return new ImageData(b,w,h);
}
// 變形：amt < 0 變瘦、> 0 變胖；chew = 嚼食時臉頰鼓起
function photoWarp(out,amt,chew){
  const S=PH.src.data,O=out.data,w=PH.w,h=PH.h,lm=fullLM(PH.lm);
  const fx=lm.face.x*w,fw=lm.face.w*w,fh=lm.face.h*h, eyeY=lm.eyesY*h, chinY=lm.chin.y*h;
  const k=Math.max(-.25,amt*.65);
  const bul=[[lm.cheekL.x*w,lm.cheekL.y*h,fw*.42,Math.max(-.3,Math.min(.75,amt*.5+(chew||0)))],
             [lm.cheekR.x*w,lm.cheekR.y*h,fw*.42,Math.max(-.3,Math.min(.75,amt*.5+(chew||0)))],
             [lm.chin.x*w,chinY+fh*.12,fw*.55,Math.max(-.2,Math.min(.7,amt*.45))]];
  const y0=eyeY, y1=chinY+fh*.9;
  for(let y=0;y<h;y++){
    const t=Math.min(1,Math.max(0,(y-y0)/(y1-y0))), g=t*t*(3-2*t);
    for(let x=0;x<w;x++){
      let sx=x, sy=y;
      if(g>0&&k!==0){const dx=x-fx, wx=Math.exp(-(dx*dx)/(fw*fw*2.6)); sx=x-dx*(1-1/(1+k*g))*wx}
      let ox=0,oy=0;
      for(let j=0;j<3;j++){const B=bul[j]; if(!B[3])continue; const vx=sx-B[0],vy=sy-B[1],r2=(vx*vx+vy*vy)/(B[2]*B[2]);
        if(r2<1){const f=B[3]*(1-r2)*(1-r2);ox-=vx*f;oy-=vy*f}}
      sx+=ox; sy+=oy;
      // 雙線性取樣
      const xi=Math.max(0,Math.min(w-2,sx|0)),yi=Math.max(0,Math.min(h-2,sy|0)),ax=Math.max(0,Math.min(1,sx-xi)),ay=Math.max(0,Math.min(1,sy-yi));
      const i00=(yi*w+xi)*4,i10=i00+4,i01=i00+w*4,i11=i01+4,o=(y*w+x)*4;
      for(let c=0;c<3;c++)O[o+c]=(S[i00+c]*(1-ax)+S[i10+c]*ax)*(1-ay)+(S[i01+c]*(1-ax)+S[i11+c]*ax)*ay;
      O[o+3]=255;
    }}
  return out;
}
function photoAmt(p){return p<.7?-.12*(.7-p)/.7:p<=1?(p-.7)/.3*.15:.15+Math.min(1.45,(p-1)*4)}
function drawBlush(ctx,amt){
  if(amt<.25)return; const lm=fullLM(PH.lm),w=PH.w,h=PH.h,a=Math.min(.45,(amt-.25)*.4);
  [lm.cheekL,lm.cheekR].forEach(c=>{const g=ctx.createRadialGradient(c.x*w,c.y*h,0,c.x*w,c.y*h,lm.face.w*w*.22);g.addColorStop(0,`rgba(235,90,80,${a})`);g.addColorStop(1,'rgba(235,90,80,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)});
}
function photoCanvas(p,cls){
  const id='pc'+(++rid);
  const paint=(n)=>{const cv=document.getElementById(id);if(!cv){if(n<10)requestAnimationFrame(()=>paint(n+1));return}if(!PH.ready)return;const ctx=cv.getContext('2d');
    const key=Math.round(photoAmt(p)*50);let img=PH.cache[key];
    if(!img){img=photoWarp(ctx.createImageData(PH.w,PH.h),photoAmt(p),0);PH.cache[key]=img}
    ctx.putImageData(img,0,0);drawBlush(ctx,photoAmt(p))};
  requestAnimationFrame(()=>paint(0));
  return `<canvas id="${id}" class="pcv ${cls||''}" width="${PH.w}" height="${PH.h}" role="img" aria-label="你的照片，今日熱量 ${Math.round(p*100)}%"></canvas>`;
}
function usePhoto(){return PH.ready}
function heroFigure(pct){
  if(PH.ready)return photoCanvas(pct,'hero-pc');
  return `<button class="pcv ph-empty" onclick="tab='settings';render();setTimeout(()=>document.getElementById('photoBox')?.scrollIntoView({behavior:'smooth'}),50)">${PH.url?'照片載入中…':'📷<br>點這裡上傳<br>你的照片'}</button>`;
}
// 照片版動畫
function runPhotoStage(fromP,toP,st){
  const cv=document.getElementById('stagePc'); if(!cv)return; const ctx=cv.getContext('2d');
  const a0=photoAmt(fromP),a1=photoAmt(toP),buf=ctx.createImageData(PH.w,PH.h);
  const t0=performance.now(); let last=-1;
  const ease=t=>{if(st!=='over')return 1-Math.pow(1-t,3);const s=1.9;return 1+Math.pow(2,-9*t)*Math.sin((t*8-.75)*2*Math.PI/3)*1.25};
  const frame=now=>{
    if(!document.getElementById('stagePc'))return;
    const t=(now-t0)/1000; let amt=a0, chew=0;
    if(t>.9&&t<2.2)chew=.14*Math.abs(Math.sin((t-.9)*11));
    if(t>=2.2){const u=Math.min(1,(t-2.2)/(st==='over'?2.4:1.4));amt=a0+(a1-a0)*ease(u);
      if(st==='over'&&t>2.6&&t<6)amt+=Math.sin(t*24)*.07*(1-(t-2.6)/3.4)}
    const q=Math.round(amt*200)+'|'+Math.round(chew*100);
    if(q!==last){photoWarp(buf,amt,chew);ctx.putImageData(buf,0,0);drawBlush(ctx,amt);last=q}
    if(t<6.2)requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
// 儲存／讀取
function savePhotoLocal(){try{localStorage.setItem(PKEY,JSON.stringify({url:PH.url,lm:PH.lm,style:PH.style}))}catch(e){toast('照片太大，手機存不下')}}
async function savePhotoCloud(){if(!db||!uid)return;try{await db.doc(`data/users/${uid}/profile`).collection('media').doc('face').set({url:PH.url||'',lm:PH.lm||null,style:PH.style})}catch(e){console.warn(e);toast('照片沒同步到雲端，換裝置會看不到：'+errMsg(e),4000)}}
async function photoInit(){
  try{const v=JSON.parse(localStorage.getItem(PKEY)||'null');if(v&&v.url){Object.assign(PH,{url:v.url,lm:v.lm,style:v.style||'paint'});await photoPrep();render()}}catch(e){}
}
async function photoCloudLoad(){
  if(PH.ready||!db||!uid)return;
  try{const s=await db.doc(`data/users/${uid}/profile`).collection('media').doc('face').get();
    if(s.exists&&s.data().url){const v=JSON.parse(JSON.stringify(s.data()));Object.assign(PH,{url:v.url,lm:v.lm,style:v.style||'paint'});savePhotoLocal();await photoPrep();render()}}catch(e){}
}
async function detectFace(blob){
  if(!(sample&&canImages))return null;
  try{
    const r=await sample.json(`找出照片中最主要的那張人臉。座標全部用 0 到 1 的比例（x 由左到右、y 由上到下，以整張照片為準）。
只回傳 JSON：{"found":true或false,"face":{"x":臉中心x,"y":臉中心y,"w":臉寬,"h":臉高(額頭到下巴)},"cheekL":{"x":,"y":},"cheekR":{"x":,"y":},"mouth":{"x":,"y":},"chin":{"x":,"y":},"eyesY":兩眼高度y}
cheekL 是照片左邊那側的臉頰。`,{images:[blob],modelTier:'default'});
    if(r&&r.found&&r.face&&r.face.w>0)return r;
  }catch(e){}
  return null;
}
function photoSection(){
  return `<section class="panel" id="photoBox"><h2>我的照片</h2>
   ${PH.ready?`<p class="muted">✅ 首頁和每餐動畫都會用這張照片</p><div class="ph-wrap"><canvas id="phPrev" width="${PH.w}" height="${PH.h}"></canvas><span class="ph-hint">點臉的正中央可以重新定位</span></div>
   <label class="f" style="margin-top:10px">預覽：今天吃到目標的 <b id="phPct">130</b>%<input type="range" id="phSlider" min="40" max="180" value="130"></label>
   <label class="f">臉的大小<input type="range" id="phSize" min="15" max="80" value="${Math.round(fullLM(PH.lm).face.w*100)}"></label>
   <div class="seg" id="phStyle"><button data-v="paint" aria-pressed="${PH.style==='paint'}">🎨 手繪動畫風</button><button data-v="raw" aria-pressed="${PH.style==='raw'}">📷 原始照片</button></div>`
   :`<p class="muted">上傳一張正面、臉清楚的照片。照片只存在你自己的帳號裡，不會出現在競賽排行榜。</p>`}
   <button class="btn ghost" id="phUp" style="margin-top:12px">${PH.url?'換一張照片':'上傳照片'}</button>
   ${PH.url?`<button class="btn ghost" id="phDel" style="margin-top:8px">刪除照片</button>`:''}
   <input type="file" id="phFile" accept="image/*" hidden></section>`;
}
function bindPhoto(){
  const $=id=>document.getElementById(id); if(!$('phUp'))return;
  $('phUp').onclick=()=>$('phFile').click();
  $('phFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return; $('phUp').disabled=true; $('phUp').textContent='處理中…';
    try{
      const img=await loadImg(URL.createObjectURL(f)); const m=380,s=Math.min(1,m/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const url=cv.toDataURL('image/jpeg',.72); const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8));
      $('phUp').textContent='正在找你的臉…';
      const lm=await detectFace(blob);
      PH.url=url;PH.lm=lm||defaultLM(); await photoPrep(); savePhotoLocal(); savePhotoCloud();
      if(local.profile&&local.profile.who!=='photo'){await saveProfile(Object.assign({},local.profile,{who:'photo'}))}
      render();
      toast(lm?'找到臉了，可以拉下方滑桿預覽':'沒找到臉的位置，請點照片上臉的中央手動定位');
    }catch(err){toast('照片讀取失敗');render()}
  };
  if($('phDel'))$('phDel').onclick=()=>{if(!confirm('刪除照片？'))return;PH.url=null;PH.ready=false;PH.lm=null;try{localStorage.removeItem(PKEY)}catch(e){}savePhotoCloud();render()};
  if(!PH.ready)return;
  const draw=()=>{const p=+$('phSlider').value/100;$('phPct').textContent=Math.round(p*100);const ctx=$('phPrev').getContext('2d');ctx.putImageData(photoWarp(ctx.createImageData(PH.w,PH.h),photoAmt(p),0),0,0);drawBlush(ctx,photoAmt(p))};
  draw(); $('phSlider').oninput=draw;
  const commit=()=>{PH.cache={};savePhotoLocal();savePhotoCloud();draw()};
  $('phPrev').onclick=e=>{const r=e.target.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const f=fullLM(PH.lm).face;
    PH.lm={face:{x,y,w:f.w,h:f.h}}; commit(); toast('已重新定位')};
  $('phSize').onchange=()=>{const f=fullLM(PH.lm).face, v=+$('phSize').value/100; PH.lm={face:{x:f.x,y:f.y,w:v,h:v*1.2*(PH.w/PH.h)}}; commit()};
  $('phStyle').querySelectorAll('button').forEach(b=>b.onclick=async()=>{PH.style=b.dataset.v;await photoPrep();savePhotoLocal();savePhotoCloud();render()});
}

const LS='calorie-app-v1';
let local={profile:null,days:{}};
try{local=JSON.parse(localStorage.getItem(LS))||local}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(local))}catch(e){
  // 手機空間不夠時，本機只保留最近 3 週的縮圖（雲端還是完整的）
  try{const cut=(()=>{const d=new Date();d.setDate(d.getDate()-21);return todayKey(d)})();
    const lite=JSON.parse(JSON.stringify(local));Object.values(lite.days||{}).forEach(d=>{if(d.date<cut)(d.meals||[]).forEach(m=>delete m.thumb)});
    localStorage.setItem(LS,JSON.stringify(lite))}catch(e2){}}}
let db=null, uid=null, sample=null, canImages=false;

let fbUser=null, isOwnerUser=false, authUid=null;
const LINK={pid:null,linked:false};
function gate(mode,info){
  let g=document.getElementById('gate');
  if(!mode){if(g)g.remove();return}
  if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
  const esc2=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  g.innerHTML=`<div class="gate-in"><div class="gate-logo">🍱</div><h1>熱量小幫手</h1>${
    mode==='login'?`<p>拍照算熱量、跟朋友比賽減脂。<br>用 Google 帳號登入就能開始。</p><button class="btn fuel" id="gLogin">用 Google 登入</button><p class="muted" id="gMsg"></p>`
   :mode==='wait'?`<p>你的帳號 <b>${esc2(info)}</b> 還沒加入使用名單。</p><p class="muted">把這個 email 傳給邀請你的人。他加進名單後，按「重新檢查」就能用。</p>
      <button class="btn fuel" id="gCopy">複製我的 email</button><button class="btn ghost" id="gRe" style="margin-top:8px">重新檢查</button>
      <div class="gate-link"><p><b>已經用另一個 Google 帳號在用了？</b><br><span class="muted">在原本的裝置打開「我的 → 多帳號歸戶」產生連結碼，輸入後這個帳號就會跟原本的帳號共用同一份紀錄。</span></p>
      <div class="row"><input class="ti" id="gCode" autocapitalize="characters" autocomplete="off" placeholder="8 碼連結碼" maxlength="9" style="text-transform:uppercase;letter-spacing:2px"><button class="btn" id="gLink" style="width:auto">歸戶</button></div><p class="muted" id="gLinkMsg"></p></div>
      <button class="btn ghost" id="gOut" style="margin-top:8px">換一個帳號登入</button>`
   :mode==='load'?`<p class="muted">登入中…</p>`
   :`<p>${esc2(info)}</p>`}</div>`;
  const $=id=>document.getElementById(id);
  if($('gLogin'))$('gLogin').onclick=async()=>{
    const pv=new firebase.auth.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
    $('gLogin').disabled=true;$('gLogin').textContent='登入中…';
    try{await firebase.auth().signInWithRedirect(pv)}
    catch(e){$('gLogin').disabled=false;$('gLogin').textContent='用 Google 登入';$('gMsg').textContent='登入失敗：'+(e.code||e.message)}};
  if($('gCopy'))$('gCopy').onclick=async()=>{try{await navigator.clipboard.writeText(info);toast('已複製')}catch(e){prompt('複製這個 email',info)}};
  if($('gRe'))$('gRe').onclick=()=>location.reload();
  if($('gOut'))$('gOut').onclick=()=>firebase.auth().signOut();
  if($('gLink'))$('gLink').onclick=async()=>{const m=$('gLinkMsg');$('gLink').disabled=true;m.textContent='連結中…';
    try{await linkWithCode($('gCode').value);m.textContent='完成，重新載入中…';setTimeout(()=>location.reload(),600)}
    catch(e){m.textContent=errMsg(e);$('gLink').disabled=false}};
}
function blobToImg(blob){return new Promise((res,rej)=>{const url=URL.createObjectURL(blob);const img=new Image();
  img.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    res({media_type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]})};img.onerror=rej;img.src=url})}
function parseJSONText(t){t=String(t||'').replace(/```json|```/g,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const i=t.search(/[\[{]/);const j=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(i>=0&&j>i)return JSON.parse(t.slice(i,j+1));throw new Error('AI 回傳的格式看不懂')}
async function callAI(prompt,o,json){
  const images=[];for(const b of (o.images||[]))images.push(await blobToImg(b));
  const token=await fbUser.getIdToken();
  const r=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:JSON.stringify({prompt,images,tier:o.modelTier||'default',json:!!json,search:!!o.search})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||('AI 服務錯誤 '+r.status));
  return d.text||'';
}
async function cloudInit(){
  if(!window.firebase||!window.APP_CONFIG||!APP_CONFIG.firebase||!APP_CONFIG.firebase.apiKey){gate('err','設定檔 config.js 還沒填好 Firebase 設定。');return}
  const fbCfg=Object.assign({},APP_CONFIG.firebase);
  // 讓登入頁走自己的網址（搭配 _redirects），iPhone Safari 才不會登入失敗
  if(/\.netlify\.app$|\.[a-z]{2,}$/.test(location.hostname)&&!/^(localhost|127\.)/.test(location.hostname))fbCfg.authDomain=location.hostname;
  firebase.initializeApp(fbCfg);
  const auth=firebase.auth(), fdb=firebase.firestore();
  gate('load');
  let redirErr='';
  auth.getRedirectResult().catch(e=>{redirErr=e.code||e.message;const m=document.getElementById('gMsg');if(m)m.textContent='登入失敗：'+redirErr});
  auth.onAuthStateChanged(async u=>{
    if(!u){gate('login');if(redirErr){const m=document.getElementById('gMsg');if(m)m.textContent='登入失敗：'+redirErr}return}
    const email=(u.email||'').toLowerCase();
    isOwnerUser=email===String(APP_CONFIG.ownerEmail||'').toLowerCase();
    authUid=u.uid; fbUser=u; LINK.pid=u.uid; LINK.linked=false;

// ---------- calc ----------
const ACT=[{k:1.2,t:'幾乎不動',d:'坐辦公室、少走路'},{k:1.375,t:'輕度',d:'每週運動 1–3 天'},{k:1.55,t:'中度',d:'每週運動 3–5 天'},{k:1.725,t:'高度',d:'每週運動 6–7 天'}];
const PACE=[{kg:.25,t:'慢慢來'},{kg:.5,t:'標準'},{kg:.75,t:'積極'}];
function calc(p){
  const bmr=p.sex==='f'?10*p.w+6.25*p.h-5*p.age-161:10*p.w+6.25*p.h-5*p.age+5;
  const tdee=bmr*(ACT[p.act]||ACT[1]).k;
  const deficit=(PACE[p.pace]||PACE[1]).kg*7700/7;
  const floor=Math.max(p.sex==='f'?1200:1500,Math.round(bmr));
  let target=Math.round(tdee-deficit);
  const floored=target<floor; if(floored)target=floor;
  const protein=Math.round(p.w*1.4);
  const bmi=p.w/((p.h/100)**2);
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),target,floored,protein,bmi};
}
const todayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function sum(meals){return meals.reduce((a,m)=>{m.items.forEach(i=>{a.kcal+=+i.kcal||0;a.p+=+i.protein_g||0;a.c+=+i.carbs_g||0;a.f+=+i.fat_g||0});return a},{kcal:0,p:0,c:0,f:0})}
function mealType(){const h=new Date().getHours();return h<10?'早餐':h<14?'午餐':h<17?'點心':h<21?'晚餐':'宵夜'}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function minutes(kcal,MET){const w=local.profile?.w||60;return Math.round(kcal/(MET*3.5*w/200))}

function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=1024,s=Math.min(1,m/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  cv.toBlob(b=>res(b||file),'image/jpeg',.85);URL.revokeObjectURL(img.src)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}

這餐（${meal.type}）：${meal.items.map(i=>`${i.name}${i.portion?'('+i.portion+')':''} ${Math.round(i.kcal)}大卡`).join('、')}。

let userNs=null;
function mondayKey(){const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return todayKey(d)}
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);const t=new Date(y,m-1,d+n);return todayKey(t)}
function compCfg(){return C.config||{title:'減脂大作戰',start:mondayKey(),end:addDays(mondayKey(),27)}}
function myPlayer(){return C.players.find(p=>p.id===uid)}
async function compInit(){
  try{
    C.isOwner=!!(await userNs.isOwner?.());
    C.canWrite=await (userNs.can?userNs.can('data.write'):null);
  }catch(e){}
  if(C.isOwner)db.doc('config/allow').onSnapshot(s=>{C.allow=s.exists?(s.data().emails||[]):[];if(tab==='comp')render()},()=>{});
  db.doc('comp/config').onSnapshot(s=>{C.config=s.exists?s.data():null;if(tab==='comp')render()},()=>{});
  db.collection('players').onSnapshot(s=>{
    C.players=s.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));
    C.ready=true; resolveNames(C.players.map(p=>p.id)); if(tab==='comp')render();
  },()=>{C.ready=true;if(tab==='comp')render()});
  db.collection('taunts').orderBy('at','desc').limit(30).onSnapshot(s=>{
    C.taunts=s.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));
    resolveNames(C.taunts.map(t=>t.from)); if(tab==='comp')render();
  },()=>{});
}
async function resolveNames(ids){
  const need=[...new Set(ids)].filter(i=>i&&!(i in C.names)); if(!need.length||!userNs?.profiles)return;
  try{const ps=await userNs.profiles(need);need.forEach(i=>C.names[i]=ps[i]?.name||'');if(tab==='comp')render()}catch(e){}
}
function nameOf(id){const p=C.players.find(x=>x.id===id);return (p&&p.nick)||C.names[id]||'神秘選手'}
function playerDays(){
  const out={};for(let i=0;i<40;i++){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);const v=local.days[k];
    if(v&&v.meals.length)out[k]={kcal:Math.round(sum(v.meals).kcal),target:budget(k)}}
  return out;
}
async function syncPlayer(extra){
  if(!db||!uid||!local.profile)return;
  const me=myPlayer(); if(!me&&!extra)return;
  const base=me?{nick:me.nick||'',joinedAt:me.joinedAt,shareWeight:!!me.shareWeight,startW:me.startW||local.profile.w}:{};
  const doc=Object.assign(base,extra||{},{days:playerDays(),curW:local.profile.w,updatedAt:Date.now()});
  doc.body=bodySummary(compCfg());
  if(!doc.shareWeight){delete doc.startW;delete doc.curW;delete doc.body}
  try{await db.doc('players/'+uid).set(doc)}catch(e){if(extra)toast('加入失敗，請檢查網路後再試一次')}
}
function scoreOf(p,cfg){
  let pts=0,streak=0,ok=0,logged=0;const today=todayKey();
  for(let k=cfg.start;k<=cfg.end&&k<=today;k=addDays(k,1)){
    const d=p.days?.[k];
    if(d&&d.kcal>0){logged++;pts+=1;
      if(d.kcal<=d.target&&d.kcal>=d.target*.7){pts+=2;ok++}}
  }
  for(let k=today,i=0;i<60;i++,k=addDays(k,-1)){const d=p.days?.[k];
    if(k===today&&!(d&&d.kcal>0))continue;
    if(d&&d.kcal>0&&d.kcal<=d.target&&d.kcal>=d.target*.7)streak++;else break}
  const td=p.days?.[today];
  return{pts,streak,ok,logged,todayP:td?td.kcal/td.target:0};
}
function miniChar(p){return charSVG(p).replace('class="char"','class="char mini"')}

      <div class="pts num">${C.rankBy==='body'?(r.bp==null?'—':r.bp.toFixed(1)):r.pts}<small>${C.rankBy==='body'?'進步':'分'}</small></div></div>`}).join('')

  <p class="muted">${cfg.start.slice(5).replace('-','/')} – ${cfg.end.slice(5).replace('-','/')}　·　${today>cfg.end?'已結束':today<cfg.start?'尚未開始':'剩 '+daysLeft+' 天'}</p>
  ${me?'':`<section class="panel join"><h2>加入競賽</h2>
    <label class="f">暱稱（排行榜上顯示）<input id="nick" maxlength="12" placeholder="不填就用你的 Google 名字"></label>
    <label class="chk"><input type="checkbox" id="shareW"> 公開體重和身體數據變化（只顯示變化，不顯示實際數字）</label>
    <button class="btn fuel" id="joinBtn">加入</button></section>`}
  <section class="panel"><h2>排行榜</h2>
    <div class="seg" id="rankBy" style="margin-bottom:8px"><button data-v="pts" aria-pressed="${C.rankBy!=='body'}">飲食記錄分</button><button data-v="body" aria-pressed="${C.rankBy==='body'}">體態進步</button></div>
    ${board}
    <p class="muted" style="margin-top:10px">${C.rankBy==='body'?'體態進步 = 體脂率下降的百分點 × 2 ＋ 體重下降 % ＋ 骨骼肌增加 kg。用競賽開始前最近一筆和最新一筆比較，只計算有公開身體數據的人。':'計分：有記錄 +1，當天吃在目標的 70%–100% 再 +2。吃太少不加分，餓肚子贏不了。'}</p>
    ${me?`<label class="chk" style="margin-top:8px"><input type="checkbox" id="shareMe" ${me.shareWeight?'checked':''}> 公開我的體重和身體數據變化（只顯示變化，不顯示實際數字）</label>`:''}</section>

    ${(C.allow||[]).map(e=>`<div class="lib-row"><span>${esc(e)}</span><button class="x" data-rmallow="${esc(e)}" aria-label="移除 ${esc(e)}">×</button></div>`).join('')||'<p class="muted">名單是空的。</p>'}
    <div class="row" style="margin-top:8px"><input id="allowIn" type="email" inputmode="email" autocapitalize="off" placeholder="朋友的 Gmail" class="ti"><button class="btn" id="allowBtn" style="width:auto">加入</button></div></section>`:''}
  ${me?`<button class="btn ghost" id="leaveBtn" style="margin-bottom:10px">退出競賽</button>`:''}`;

function bindComp(){
  const $=id=>document.getElementById(id);
  if($('joinBtn'))$('joinBtn').onclick=async()=>{
    $('joinBtn').disabled=true;
    const share=$('shareW').checked;
    await syncPlayer({nick:$('nick').value.trim(),joinedAt:Date.now(),shareWeight:share,startW:local.profile.w});
    $('joinBtn')&&($('joinBtn').disabled=false);
  };
  const send=async t=>{t=(t||'').trim();if(!t)return;
    try{await db.collection('taunts').add({from:uid,text:t.slice(0,60),at:Date.now()});$('tauntIn')&&($('tauntIn').value='')}
    catch(e){toast('送不出去，請檢查網路')}};
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>send(b.dataset.t));
  if($('tauntBtn'))$('tauntBtn').onclick=()=>send($('tauntIn').value);
  app.querySelectorAll('[data-dt]').forEach(b=>b.onclick=async()=>{try{await db.doc('taunts/'+b.dataset.dt).delete()}catch(e){toast('刪除失敗')}});
  if($('inviteBtn'))$('inviteBtn').onclick=async()=>{
    const text='來跟我比減脂！一起用熱量小幫手記錄吃了什麼：'+SHARE_URL;
    try{if(navigator.share){await navigator.share({title:'熱量小幫手競賽',text,url:SHARE_URL});return}}catch(e){if(e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(text);toast('連結已複製')}catch(e){prompt('複製這段傳給朋友',text)}
  };
  app.querySelectorAll('#rankBy button').forEach(b=>b.onclick=()=>{C.rankBy=b.dataset.v;render()});
  if($('shareMe'))$('shareMe').onchange=e=>syncPlayer({shareWeight:e.target.checked,startW:myPlayer()?.startW||local.profile.w}).then(()=>toast(e.target.checked?'已公開身體數據變化':'已改成不公開'));
  if($('cSave'))$('cSave').onclick=async()=>{
    const c={title:$('cTitle').value.trim()||'減脂大作戰',start:$('cStart').value,end:$('cEnd').value};
    if(!c.start||!c.end||c.end<c.start){toast('日期不對');return}
    try{await db.doc('comp/config').set(Object.assign({},C.config||{},c));toast('已儲存')}catch(e){toast('儲存失敗')}
  };
  const saveAllow=async list=>{try{await db.doc('config/allow').set({emails:list});toast('名單已更新')}catch(e){toast('名單儲存失敗')}};
  if($('allowBtn'))$('allowBtn').onclick=()=>{const e=$('allowIn').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('email 格式不對');return}
    if((C.allow||[]).includes(e)){toast('已經在名單裡');return}saveAllow([...(C.allow||[]),e])};
  app.querySelectorAll('[data-rmallow]').forEach(b=>b.onclick=()=>{if(confirm('把 '+b.dataset.rmallow+' 移出名單？他就不能再用了。'))saveAllow((C.allow||[]).filter(x=>x!==b.dataset.rmallow))});
  if($('leaveBtn'))$('leaveBtn').onclick=async()=>{if(!confirm('退出後你的分數會從排行榜移除，確定？'))return;try{await db.doc('players/'+uid).delete()}catch(e){toast('退出失敗')}};
}

// ---------- 喝水 ----------
function waterGoal(){const p=local.profile||{};return +p.waterGoal||Math.min(4000,Math.max(1200,Math.round((+p.w||60)*30/50)*50))}
function waterTotal(k){return ((local.days[k]||{}).water||[]).reduce((a,x)=>a+(+x.ml||0),0)}
const WATER={shown:{}};
function bottleSVG(pct,id){
  // pct: 0~1，水位用 translateY 控制，畫面更新時從上一次的水位動到新水位
  const H=150,top=34,bot=144,from=WATER.shown[id]??pct,y=v=>(bot-top)*(1-Math.min(1,v));
  return `<svg viewBox="0 0 90 ${H}" class="bottle" aria-hidden="true">
    <defs><clipPath id="bc-${id}"><path d="M30 6h30v14c0 4 16 8 16 22v92a10 10 0 0 1-10 10H24a10 10 0 0 1-10-10V42c0-14 16-18 16-22z"/></clipPath></defs>
    <g clip-path="url(#bc-${id})"><rect x="0" y="0" width="90" height="${H}" class="bt-bg"/>
      <g class="bt-water" data-to="${y(pct).toFixed(1)}" style="transform:translateY(${y(from).toFixed(1)}px)">
        <path class="bt-wave" d="M-90 ${top} q11.25 -6 22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 V200 H-90z"/>
        <path class="bt-wave2" d="M-90 ${top+3} q11.25 5 22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 t22.5 0 V200 H-90z"/></g>
      ${[.25,.5,.75].map(f=>`<line x1="62" x2="70" y1="${top+(bot-top)*(1-f)}" y2="${top+(bot-top)*(1-f)}" class="bt-tick"/>`).join('')}</g>
    <path d="M30 6h30v14c0 4 16 8 16 22v92a10 10 0 0 1-10 10H24a10 10 0 0 1-10-10V42c0-14 16-18 16-22z" class="bt-glass"/>
    <rect x="28" y="1" width="34" height="8" rx="3" class="bt-cap"/>
  </svg>`;
}
function waterCard(k){
  const t=waterTotal(k),g=waterGoal(),pct=t/g,log=(local.days[k]||{}).water||[],last=log[log.length-1];
  return `<section class="panel wcard" id="wcard"><div class="wbody">${bottleSVG(pct,'today')}<div class="wfloat" id="wfloat"></div></div>
    <div class="winfo"><h2 style="margin:0">喝水</h2>
      <div><b class="num" style="font-size:28px">${t.toLocaleString()}</b><span class="muted"> / ${g.toLocaleString()} ml</span></div>
      <p class="muted" style="margin:0 0 8px">${pct>=1?'今天達標了 💧':'再喝 '+(g-t).toLocaleString()+' ml'}</p>
      <div class="wbtns"><button class="btn ghost" data-wadd="150">+150</button><button class="btn ghost" data-wadd="250">+250</button><button class="btn ghost" data-wadd="500">+500</button></div>
      <div class="row" style="justify-content:space-between;margin-top:6px">${last?`<button class="x wlink" id="wUndo">復原 +${last.ml}</button>`:'<span></span>'}<button class="x wlink" id="wMore">紀錄・目標</button></div>
    </div></section>`;
}
function bindWater(root,k){
  root.querySelectorAll('[data-wadd]').forEach(b=>b.onclick=()=>addWater(k,+b.dataset.wadd));
  const u=root.querySelector('#wUndo');if(u)u.onclick=()=>{WATER.shown.today=waterTotal(k)/waterGoal();const d=day(k);d.water=(d.water||[]).slice(0,-1);saveLocal();render();saveDay(k)};
  const m=root.querySelector('#wMore');if(m)m.onclick=()=>openWater(k);
  // 水位動畫
  requestAnimationFrame(()=>requestAnimationFrame(()=>{root.querySelectorAll('.bt-water').forEach(g=>{g.style.transform=`translateY(${g.dataset.to}px)`})}));
  WATER.shown.today=waterTotal(k)/waterGoal();
}
async function addWater(k,ml){
  if(!(ml>0))return;
  const before=waterTotal(k),g=waterGoal();
  WATER.shown.today=before/g;
  const d=day(k);d.water=(d.water||[]).concat({ml:Math.round(ml),t:new Date().toTimeString().slice(0,5)});
  saveLocal();
  if(k===todayKey()&&tab==='today'){render();const f=document.getElementById('wfloat');if(f){f.textContent='+'+ml;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}}
  else{render();toast(`已記錄喝水 ${ml} ml${k!==todayKey()?'（'+k.slice(5).replace('-','/')+'）':''}`)}
  navigator.vibrate?.(20);
  if(before<g&&before+ml>=g)setTimeout(()=>toast('今天喝水達標了 💧'),700);
  await saveDay(k);
}
function openWater(k){
  const draw=()=>{const log=(local.days[k]||{}).water||[],t=waterTotal(k),g=waterGoal();
    openSheet(`<h2>喝水　<span class="muted">${k.slice(5).replace('-','/')}</span></h2>

// 每個人有一個 pid（第一個帳號的 uid）。其他帳號輸入連結碼後歸戶到同一個 pid，所有紀錄共用。
const LK={code:null,exp:0,list:null,busy:false};
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function makeLinkCode(){
  const a=new Uint8Array(8);crypto.getRandomValues(a);const code=[...a].map(x=>CODE_ABC[x%CODE_ABC.length]).join('');
  const exp=Date.now()+10*60e3;
  await db.doc('linkCodes/'+code).set({pid:uid,exp,by:authUid});
  LK.code=code;LK.exp=exp;return code;
}
async function linkWithCode(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==8)throw new Error('連結碼是 8 碼英數字');
  const fdb=firebase.firestore(),me=firebase.auth().currentUser;
  let c;try{c=await fdb.doc('linkCodes/'+code).get()}catch(e){throw new Error('查不到連結碼，請確認網路')}
  if(!c.exists)throw new Error('連結碼不對，請再確認一次');
  const {pid,exp}=c.data();
  if(exp<Date.now())throw new Error('連結碼過期了，請在原本的裝置重新產生');
  if(pid===me.uid)throw new Error('這是同一個帳號，不用歸戶');
  await fdb.doc('links/'+me.uid).set({pid,code,email:(me.email||'').toLowerCase(),at:Date.now()});
  await mergeOldData(fdb,me.uid,pid);
  try{await fdb.doc('linkCodes/'+code).delete()}catch(e){}
  try{localStorage.removeItem(LS)}catch(e){}
  return pid;
}
// 這個帳號歸戶前自己的紀錄，合併進 pid（同一天的餐點不重複加入）
async function mergeOldData(fdb,from,pid){
  const src=fdb.doc(`data/users/${from}/profile`),dst=fdb.doc(`data/users/${pid}/profile`);
  try{
    const days=await src.collection('days').get();
    for(const x of days.docs){if(!x.exists)continue;const v=JSON.parse(JSON.stringify(x.data()));
      const cur=await dst.collection('days').doc(v.date).get();const c=cur.exists?JSON.parse(JSON.stringify(cur.data())):{date:v.date,meals:[]};
      const sig=m=>(m.time||'')+'|'+(m.items||[]).map(i=>i.name+i.kcal).join(',');
      const have=new Set((c.meals||[]).map(sig));
      c.meals=(c.meals||[]).concat((v.meals||[]).filter(m=>!have.has(sig(m))));
      const ws=new Set((c.water||[]).map(w=>w.t+'|'+w.ml));c.water=(c.water||[]).concat((v.water||[]).filter(w=>!ws.has(w.t+'|'+w.ml)));
      c.burn=Math.max(+c.burn||0,+v.burn||0);
      await dst.collection('days').doc(v.date).set(c)}
    const body=await src.collection('body').get();
    for(const x of body.docs){if(x.exists)await dst.collection('body').doc(x.id).set(JSON.parse(JSON.stringify(x.data())))}
    const p=await dst.get();if(!p.exists){const op=await src.get();if(op.exists)await dst.set(JSON.parse(JSON.stringify(op.data())))}
  }catch(e){console.warn('merge',e)}
  try{await fdb.doc('players/'+from).delete()}catch(e){}
}

function healthToken(){return local.profile&&local.profile.healthToken||''}
async function ensureHealthToken(){
  if(healthToken())return healthToken();
  const a=new Uint8Array(20);crypto.getRandomValues(a);const t=[...a].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,32);
  await saveProfile(Object.assign({},local.profile,{healthToken:t}),true);return t;
}
async function healthPull(){
  const t=healthToken();if(!t)return;
  try{
    const r=await fetch('/api/health?token='+t+'&since='+addDays(todayKey(),-45));const d=await r.json();
    let nb=0,nw=0;const touched=new Set();
    for(const e of (d.entries||[])){
      if(e.burn!=null){const dy=day(e.date);if(+dy.burn!==+e.burn){dy.burn=e.burn;dy.burnSrc='health';touched.add(e.date);nb++}}
      if(e.weight!=null){const ex=bodyList().find(x=>x.date===e.date&&x.src==='health');
        if(!ex||Math.abs(ex.w-e.weight)>.01){await saveBody(Object.assign({},ex||{},{date:e.date,src:'health',w:e.weight,t:'07:00'}),true);nw++}}
    }
    for(const k of touched)await saveDay(k);
    local.healthAt=Date.now();saveLocal();
    if(nb||nw){render();toast(`已從 Apple 健康同步${nb?' '+nb+' 天運動消耗':''}${nw?(nb?'、':' ')+nw+' 筆體重':''}`)}
  }catch(e){console.warn('health',e)}
}

const BF=[['w','體重','kg',1,-1],['fat','體脂率','%',1,-1],['smm','骨骼肌重','kg',1,1],['fm','體脂肪重','kg',1,-1],['bmi','BMI','',1,-1],
  ['vf','內臟脂肪等級','',0,-1],['bmr','基礎代謝','大卡',0,1],['score','InBody 分數','分',0,1],['waist','腰圍','cm',1,-1]];
const BFm=Object.fromEntries(BF.map(f=>[f[0],f]));

function bodyList(){return (local.body||[]).slice().sort((a,b)=>(a.date+(a.t||'')).localeCompare(b.date+(b.t||'')))}
function bodyLatest(k){const L=bodyList().filter(r=>r[k]!=null);return L[L.length-1]||null}
async function bodyCloudLoad(){
  if(!db||!uid)return;
  try{const q=await db.doc(`data/users/${uid}/profile`).collection('body').get();
    const cloud=q.docs.filter(x=>x.exists).map(x=>Object.assign(JSON.parse(JSON.stringify(x.data())),{id:x.id}));
    const ids=new Set(cloud.map(r=>r.id));
    const localOnly=(local.body||[]).filter(r=>!ids.has(r.id));
    local.body=cloud.concat(localOnly);saveLocal();
    localOnly.forEach(r=>db.doc(`data/users/${uid}/profile`).collection('body').doc(r.id).set(r).catch(()=>{}));
    if(tab==='body')render();syncPlayer();
  }catch(e){console.warn('body',e)}
}
async function saveBody(rec,quiet){
  rec=Object.assign({},rec);if(!rec.id)rec.id=rec.date.replace(/-/g,'')+'-'+Date.now().toString(36);rec.t=rec.t||new Date().toTimeString().slice(0,5);
  BF.forEach(([k])=>{if(rec[k]===''||rec[k]==null||isNaN(+rec[k]))delete rec[k];else rec[k]=+rec[k]});
  local.body=(local.body||[]).filter(r=>r.id!==rec.id).concat(rec);saveLocal();
  if(db)db.doc(`data/users/${uid}/profile`).collection('body').doc(rec.id).set(rec).catch(()=>toast('雲端同步失敗，已存在這支手機'));
  const lw=bodyLatest('w');
  if(lw&&lw.id===rec.id&&!(quiet&&rec.src==='health'&&local.profile&&Math.abs(+local.profile.w-rec.w)<=.01)&&local.profile&&Math.abs(+local.profile.w-rec.w)>.01){await saveProfile(Object.assign({},local.profile,{w:rec.w}),true);if(!quiet)toast('已更新體重，每日熱量目標也重新計算了')}
  else syncPlayer();
  return rec;
}
async function deleteBody(id){

  syncPlayer();
}
function bodySummary(cfg){
  // 競賽比較：開始日（含）之前最近一筆 vs 最新一筆
  const out={};for(const k of ['w','fat','smm']){const L=bodyList().filter(r=>r[k]!=null);if(!L.length)continue;
    const before=L.filter(r=>r.date<=cfg.start);const a=(before[before.length-1]||L[0]),b=L[L.length-1];
    out[k]=[a[k],b[k],a.date,b.date]}
  return Object.keys(out).length?out:null;
}
function bodyProgress(b){
  if(!b)return null;let v=0,has=false;
  if(b.fat&&b.fat[2]!==b.fat[3]){v+=(b.fat[0]-b.fat[1])*2;has=true}
  if(b.w&&b.w[2]!==b.w[3]&&b.w[0]){v+=(b.w[0]-b.w[1])/b.w[0]*100;has=true}
  if(b.smm&&b.smm[2]!==b.smm[3]){v+=b.smm[1]-b.smm[0];has=true}
  return has?Math.round(v*10)/10:null;
}
function bodyChips(b){

function fmtB(k,v){const f=BFm[k];return v==null?'—':(+v).toFixed(f[3])+(f[2]?' '+f[2]:'')}
function bodyChart(){
  const k=BODY.metric,f=BFm[k];let L=bodyList().filter(r=>r[k]!=null);
  if(BODY.range){const cut=addDays(todayKey(),-BODY.range);L=L.filter(r=>r.date>=cut)}
  if(!L.length)return `<p class="muted" style="padding:28px 0;text-align:center">這段期間還沒有${f[1]}的紀錄。</p>`;
  const W=340,H=190,pl=40,pr=14,pt=14,pb=26;
  const t=r=>new Date(r.date+'T'+(r.t||'12:00')).getTime();
  const xs=L.map(t),ys=L.map(r=>+r[k]);let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0){x0-=864e5*3;x1+=864e5*3}
  let y0=Math.min(...ys),y1=Math.max(...ys);const pad=Math.max((y1-y0)*.2,f[0]==='w'?1:f[0]==='fat'?1:.5);y0-=pad;y1+=pad;
  const X=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const ticks=[0,1,2,3].map(i=>y0+(y1-y0)*i/3);
  const md=ms=>{const d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()};
  const path=L.map((r,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(ys[i]).toFixed(1)).join(' ');
  const tip=BODY.tip!=null&&L[BODY.tip]?BODY.tip:L.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" class="bchart" role="img" aria-label="${f[1]}趨勢圖，${L.length} 筆，最新 ${fmtB(k,ys[ys.length-1])}">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="g"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" class="ax">${v.toFixed(f[3]&&y1-y0<10?1:0)}</text>`).join('')}
    <text x="${pl}" y="${H-6}" class="ax">${md(x0)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" class="ax">${md(x1)}</text>
    <path d="${path}" class="ln"/>
    <line x1="${X(xs[tip])}" x2="${X(xs[tip])}" y1="${pt}" y2="${H-pb}" class="cross"/>
    ${L.map((r,i)=>`<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="${i===tip?6:4}" class="pt ${i===tip?'on':''}"/><rect x="${X(xs[i])-14}" y="${pt}" width="28" height="${H-pt-pb}" fill="transparent" data-bi="${i}" style="cursor:pointer"/>`).join('')}
  </svg>
  <p class="btip"><b>${L[tip].date.slice(5).replace('-','/')}</b>　${f[1]} <b class="num">${fmtB(k,ys[tip])}</b>${L[tip].src==='inbody'?'　<span class="muted">InBody</span>':''}</p>`;
}

  <p class="muted" style="margin-bottom:16px">新的體重會自動更新每日熱量目標。在競賽頁勾選公開後，朋友只會看到變化，看不到實際數字。</p>`;

const TF={list:null,p:null};
function tfndLoad(){
  if(TF.list)return Promise.resolve(TF.list);
  if(!TF.p)TF.p=(async()=>{
    try{const c=JSON.parse(localStorage.getItem('tfnd-v1')||'null');if(c&&c.at>Date.now()-30*864e5&&c.list.length){TF.list=c.list;return TF.list}}catch(e){}
    const r=await fetch('/api/tfnd');const d=await r.json();if(!Array.isArray(d))throw new Error(d.error||'讀取失敗');
    TF.list=d;try{localStorage.setItem('tfnd-v1',JSON.stringify({at:Date.now(),list:d}))}catch(e){}
    return d})().catch(e=>{TF.p=null;throw e});
  return TF.p;
}
function tfndSearch(q){
  const n=normName(q);if(!n||!TF.list)return[];
  const out=[];for(const f of TF.list){const nm=normName(f[0]),al=String(f[1]).split(/[,，、]/).map(normName);
    let sc=nm===n?100:al.includes(n)?90:nm.startsWith(n)?70:nm.includes(n)?50:al.some(a=>a&&a.includes(n))?40:0;
    if(sc){if(/熟|煮|蒸|烤|炒/.test(f[3]))sc+=5;out.push([sc,f])}}
  return out.sort((a,b)=>b[0]-a[0]||a[1][0].length-b[1][0].length).slice(0,25).map(x=>x[1]);
}
function tfndItem(f,g){const k=g/100;return{name:f[0]+(f[3]?`（${f[3]}）`:''),portion:Math.round(g)+'g',kcal:Math.round(f[4]*k),
  protein_g:Math.round(f[5]*k*10)/10,carbs_g:Math.round(f[6]*k*10)/10,fat_g:Math.round(f[7]*k*10)/10,emoji:'',src:'tfnd'}}
function applyTfnd(i){
  // AI 判斷是單一基本食材時，改用食藥署的官方數值計算
  if(!TF.list||!i||!i.base||!(+i.g>0)||(i.source&&i.source!=='est'))return i;
  const n=normName(i.base);
  const hit=TF.list.filter(f=>normName(f[0])===n||String(f[1]).split(/[,，、]/).map(normName).includes(n));
  if(!hit.length)return i;
  const f=hit.find(x=>/熟|煮|蒸|烤|炒/.test(x[3]))||hit[0], t=tfndItem(f,+i.g);
  return Object.assign({},i,{kcal:t.kcal,protein_g:t.protein_g,carbs_g:t.carbs_g,fat_g:t.fat_g,portion:(i.portion?i.portion+'，':'')+'約'+Math.round(+i.g)+'g',source:'tfnd'});
}

async function saveToLib(item,quiet){

    <p class="muted" style="font-size:13px">商品庫是大家共用的，改了之後朋友辨識到這個商品也會用新的數字。</p>
    <button class="btn fuel" id="leSave">${f?'儲存修改':'新增'}</button>
    ${canDel?'<button class="btn ghost" id="leDel" style="margin-top:8px;color:var(--over)">刪除這個商品</button>':''}`);
  const $=i=>document.getElementById(i);
  $('leSave').onclick=async()=>{
    const name=$('leName').value.trim(),kcal=Math.round(+$('leKcal').value);
    if(!name||!(kcal>0)){toast('品名和熱量要填');return}
    const dup=foodList().find(x=>x.id!==id&&normName(x.name)===normName(name));if(dup&&!confirm('商品庫已經有「'+dup.name+'」，還是要存成另一筆嗎？'))return;
    const n1=x=>x===''?0:Math.round(+x*10)/10;
    const doc=Object.assign({},f||{},{name,aliases:$('leAlias').value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean),portion:$('lePortion').value.trim()||'1份',kcal,
      protein_g:n1($('leP').value),carbs_g:n1($('leC').value),fat_g:n1($('leF').value),editedName:(fbUser&&fbUser.displayName)||'',editedAt:Date.now()});
    delete doc.id;if(!f){doc.by=uid||'';doc.at=Date.now();doc.src='manual'}else if(f.kcal!==kcal)doc.src='edit';
    $('leSave').disabled=true;
    try{if(db){if(f)await db.doc('foods/'+id).set(doc);else await db.collection('foods').add(doc)}
      else{const L=(local.foods||[]).filter(x=>x.id!==id);L.push(Object.assign({id:id||'local'+Date.now()},doc));local.foods=L;saveLocal()}
      closeSheet();toast(f?'已更新商品庫':'已新增到商品庫');if(tab==='settings')render()}
    catch(e){$('leSave').disabled=false;toast('儲存失敗：'+errMsg(e))}
  };
  if($('leDel'))$('leDel').onclick=async()=>{if(!confirm('從商品庫刪除「'+f.name+'」？朋友也會看不到。'))return;
    try{if(db&&!id.startsWith('local'))await db.doc('foods/'+id).delete();else{local.foods=(local.foods||[]).filter(x=>x.id!==id);saveLocal()}closeSheet();toast('已刪除');if(tab==='settings')render()}
    catch(e){toast('刪除失敗：只有新增的人或管理者可以刪')}};
}

// ---------- misc ----------
function toast(t,ms){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display='none',ms||2200)}
document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.onclick=()=>{if(!local.profile)return;tab=b.dataset.tab;render();window.scrollTo(0,0)});
render(); cloudInit(); photoInit();
</script>
</body>
</html>
